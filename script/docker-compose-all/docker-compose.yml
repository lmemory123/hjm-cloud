networks:
  hjm-network:
    driver: bridge

services:
  # Middleware: Postgres
  hjm-postgres:
    image: postgres:15-alpine
    container_name: hjm-postgres
    environment:
      POSTGRES_USER: ruoyi
      POSTGRES_PASSWORD: ruoyi123
      POSTGRES_DB: ry-cloud
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ../sql/postgres:/docker-entrypoint-initdb.d
      - ./middleware/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruoyi -d ry-cloud"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - hjm-network

  # Middleware: Valkey
  hjm-valkey:
    image: valkey-bundle:9.1.0
    container_name: hjm-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - hjm-network

  # Middleware: Nacos
  hjm-nacos:
    build:
      context: ../../ruoyi-visual/ruoyi-nacos
      dockerfile: Dockerfile
    container_name: hjm-nacos
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true -Dspring.data.redis.timeout=10000 -Dspring.data.redis.database=0"
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      hjm-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/index.html"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hjm-network

  # Middleware: RabbitMQ
  hjm-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: hjm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ruoyi
      RABBITMQ_DEFAULT_PASS: ruoyi123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - hjm-network

  # Backend: Gateway
  ruoyi-gateway:
    build:
      context: ../../ruoyi-gateway
      dockerfile: Dockerfile
    container_name: ruoyi-gateway
    command: ["sh", "-c", "sleep 30 && java -Djava.security.egd=file:/dev/./urandom -jar app.jar"]
    ports:
      - "8080:8080"
    environment:
      SPRING_CLOUD_NACOS_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: prod
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: prod
      SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED: "false"
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true -Dspring.data.redis.timeout=10000 -Dspring.data.redis.database=0 -Dspring.data.redis.host=hjm-valkey"
      SPRING_DATA_REDIS_HOST: hjm-valkey
      SPRING_REDISSON_ADDRESS: redis://hjm-valkey:6379
      SPRING_PROFILES_ACTIVE: prod
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD}
      SEATA_ENABLED: "false"
    depends_on:
      hjm-nacos:
        condition: service_healthy
      hjm-valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/music/open/api/v1/meta"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - hjm-network

  # Backend: Auth
  ruoyi-auth:
    build:
      context: ../../ruoyi-auth
      dockerfile: Dockerfile
    container_name: ruoyi-auth
    command: ["sh", "-c", "sleep 30 && java -Djava.security.egd=file:/dev/./urandom -jar app.jar"]
    environment:
      SPRING_CLOUD_NACOS_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: prod
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: prod
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true -Dspring.data.redis.timeout=10000 -Dspring.data.redis.database=0 -Dspring.data.redis.host=hjm-valkey"
      SPRING_DATA_REDIS_HOST: hjm-valkey
      SPRING_REDISSON_ADDRESS: redis://hjm-valkey:6379
      SPRING_PROFILES_ACTIVE: prod
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD}
      SEATA_ENABLED: "false"
    depends_on:
      hjm-nacos:
        condition: service_healthy
      hjm-valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9210/code"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - hjm-network

  # Backend: System
  ruoyi-system:
    build:
      context: ../../ruoyi-modules/ruoyi-system
      dockerfile: Dockerfile
    container_name: ruoyi-system
    command: ["sh", "-c", "sleep 30 && java -Djava.security.egd=file:/dev/./urandom -jar app.jar"]
    environment:
      SPRING_CLOUD_NACOS_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: prod
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: prod
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true -Dspring.data.redis.timeout=10000 -Dspring.data.redis.database=0 -Dspring.data.redis.host=hjm-valkey"
      SPRING_DATA_REDIS_HOST: hjm-valkey
      SPRING_REDISSON_ADDRESS: redis://hjm-valkey:6379
      SPRING_PROFILES_ACTIVE: prod
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD}
      SEATA_ENABLED: "false"
    depends_on:
      hjm-nacos:
        condition: service_healthy
      hjm-postgres:
        condition: service_healthy
      hjm-valkey:
        condition: service_healthy
    healthcheck:
      # Fix P0-2: Use basic auth for actuator
      test: ["CMD", "curl", "-u", "ruoyi:123456", "-f", "http://localhost:9201/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - hjm-network

  # Backend: Music Web (Hajihami Core)
  hjm-music-web:
    build:
      context: ../../ruoyi-modules/hjm-music-web
      dockerfile: ../../script/docker-compose-all/backend/Dockerfile.music-web
    container_name: hjm-music-web
    command: ["sh", "-c", "sleep 30 && java -Djava.security.egd=file:/dev/./urandom -jar app.jar"]
    ports:
      - "9212:9212"
    environment:
      SPRING_CLOUD_NACOS_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: hjm-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: prod
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: prod
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true -Dspring.data.redis.timeout=10000 -Dspring.data.redis.database=0 -Dspring.data.redis.host=hjm-valkey"
      SPRING_DATA_REDIS_HOST: hjm-valkey
      SPRING_REDISSON_ADDRESS: redis://hjm-valkey:6379
      MYBATIS_FLEX_MAPPER_PACKAGE: org.dromara.music.mapper
      SPRING_PROFILES_ACTIVE: prod
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD}
      SEATA_ENABLED: "false"
    depends_on:
      hjm-nacos:
        condition: service_healthy
      hjm-postgres:
        condition: service_healthy
      hjm-valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9212/checkAliveServer"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - hjm-network

  # Admin: Soybean Admin
  hjm-admin:
    build:
      context: ../../../hjm-admin
      dockerfile: Dockerfile
    container_name: hjm-admin
    ports:
      - "81:80"
    environment:
      VITE_SERVICE_BASE_URL: http://localhost:8080
    depends_on:
      ruoyi-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - hjm-network

  # Frontend: Nuxt 4
  hjm-frontend:
    build:
      context: ../../../hjm-web-nuxt-frontend
      dockerfile: Dockerfile
    container_name: hjm-frontend
    ports:
      - "3000:3000"
    volumes:
      - /Users/momao/Music/网易云音乐:/app/local-media:ro
    environment:
      NUXT_API_BASE: http://ruoyi-gateway:8080
      NUXT_PUBLIC_API_BASE: http://localhost:8080
      LOCAL_MEDIA_DIR: /app/local-media
    depends_on:
      ruoyi-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - hjm-network

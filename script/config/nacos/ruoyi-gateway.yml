# Security
security:
  ignore:
    whites:
      - /auth/**
      - /music/**
      - /system/**
      - /open/**

# API Decrypt (Fix P0-1)
api-decrypt:
  enabled: false
  header-flag: "encrypt-key"

spring:
  cloud:
    gateway:
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        - id: music-route
          uri: http://hjm-music-web:9212
          predicates:
            - Path=/music/**
          filters:
            - StripPrefix=1
        - id: auth-route
          uri: http://ruoyi-auth:9210
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: system-route
          uri: http://ruoyi-system:9201
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1

server:
  undertow:
    max-http-post-size: -1
    buffer-size: 512
    direct-buffers: true
    threads:
      io: 8
      worker: 256

dubbo:
  application:
    qos-enable: false
    threadpool: virtual
  protocol:
    name: dubbo
    port: -1
  consumer:
    timeout: 10000
  metadata-report:
    cluster: false
    parameters:
      timeout: 10000
      database: 0
  registry:
    # 解决 P0-2: Dubbo 凭据占位符解析
    username: ${spring.cloud.nacos.username:nacos}
    password: ${spring.cloud.nacos.password:nacos}
  custom:
    request-log: true
    log-level: info

spring:
  threads:
    virtual:
      enabled: true
  task:
    execution:
      thread-name-prefix: async-
      mode: force
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 10MB
  mvc:
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    use-jackson2-defaults: true
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      INDENT_OUTPUT: false
      fail_on_empty_beans: false
    deserialization:
      fail_on_unknown_properties: false
  cloud:
    nacos:
      # 解决 P0-2: 为 Dubbo 提供全局默认值
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        metadata:
          username: ruoyi
          userpassword: 123456
    bus:
      id: ${spring.application.name}
      base-packages: org.dromara.**.event
    gateway:
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        - id: music-route
          uri: lb://hjm-music-web
          predicates:
            - Path=/music/**
          filters:
            - StripPrefix=1
        - id: auth-route
          uri: lb://ruoyi-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:hjm-rabbitmq}
    port: 5672
    username: ruoyi
    password: ruoyi123
  data:
    redis:
      host: ${SPRING_REDIS_HOST:hjm-redis}
      port: 6379
      database: 0
      timeout: 10000
      ssl:
        enabled: false

valkey:
  query:
    enabled: false

redisson:
  keyPrefix:
  threads: 4
  nettyThreads: 8
  singleServerConfig:
    address: ${SPRING_REDISSON_ADDRESS:redis://hjm-redis:6379}
    clientName: ${spring.application.name}
    connectionMinimumIdleSize: 8
    connectionPoolSize: 32
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 50

security:
  ignore:
    whites:
      - /auth/**
      - /music/**
      - /system/**
      - /open/**
      - /warm-flow-ui/**
      - /actuator/**

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/${spring.application.name}/console.log

logging:
  level:
    org.springframework: warn
    org.apache.dubbo: error
    com.alibaba.nacos: error
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
    io.micrometer: error
    org.springframework.context.support.PostProcessorRegistrationDelegate: error
  config: classpath:logback-plus.xml

sa-token:
  token-name: Authorization
  check-same-token: false
  is-concurrent: true
  is-share: false
  jwt-secret-key: abcdefghijklmnopqrstuvwxyz

mybatis-flex:
  check-config-location: false
  mapper-package: ${MYBATIS_FLEX_MAPPER_PACKAGE:org.dromara.**.mapper}
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.dromara.**.domain
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: FULL
    auto-mapping-unknown-column-behavior: NONE
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    print-banner: true
    key-config:
      key-type: Generator
      value: snowFlakeId
    deleted-value-of-logic-delete: "1"
    normal-value-of-logic-delete: "0"

seata:
  enabled: ${SEATA_ENABLED:false}
  application-id: ${spring.application.name}
  tx-service-group: ${spring.application.name}-group
  config:
    type: nacos
    nacos:
      server-addr: ${spring.cloud.nacos.server-addr}
      group: ${spring.cloud.nacos.config.group}
      namespace: ${spring.profiles.active}
      data-id: seata-server.properties
  registry:
    type: nacos
    nacos:
      application: ruoyi-seata-server
      server-addr: ${spring.cloud.nacos.server-addr}
      group: ${spring.cloud.nacos.discovery.group}
      namespace: ${spring.profiles.active}
  enable-auto-data-source-proxy: false

